<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kari Burt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f0f;
            color: #f5f5f5;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        p {
            font-size: 1.25rem;
            color: #888;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            border: 2px solid #f5f5f5;
            color: #f5f5f5;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
        }

        .btn:hover {
            background: #f5f5f5;
            color: #0f0f0f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kari Burt</h1>
        <p>I build projects around things I love.</p>
        <a href="https://www.kariburt.com" class="btn">Check them out</a>
    </div>
</body>
</html>
