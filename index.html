<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kari Burt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f0f;
            color: #f5f5f5;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .projects {
            max-width: 700px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .project {
            margin-bottom: 2.5rem;
        }

        .project .label {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 0.5rem;
        }

        .project a {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f5f5f5;
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .project a:hover {
            border-color: #f5f5f5;
        }

        .about-link {
            text-align: center;
            padding: 2rem 2rem 4rem;
        }

        .about-link a {
            color: #888;
            text-decoration: none;
            font-size: 1rem;
            border-bottom: 1px solid #888;
            transition: color 0.2s, border-color 0.2s;
        }

        .about-link a:hover {
            color: #f5f5f5;
            border-color: #f5f5f5;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1.25rem;
            color: #888;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            border: 2px solid #f5f5f5;
            color: #f5f5f5;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
        }

        .btn:hover {
            background: #f5f5f5;
            color: #0f0f0f;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div>
            <h1>I build projects around things I love.</h1>
            <p>Kari Burt</p>
            <a href="#projects" class="btn">Check them out</a>
        </div>
    </div>

    <section id="projects" class="projects">
        <div class="project">
            <p class="label">I love comedy</p>
            <a href="https://findopenmyc.com">findopenmyc.com</a>
        </div>
        <div class="project">
            <p class="label">I love trading stocks</p>
            <a href="https://ottacharts.com">ottacharts.com</a>
        </div>
        <div class="project">
            <p class="label">I believe in OSS</p>
            <a href="https://safebanner.com">safebanner.com</a>
        </div>
        <div class="project">
            <p class="label">I believe in student support</p>
            <a href="https://uhausintel.com">uhausintel.com</a>
        </div>
    </section>

    <div class="about-link">
        <a href="https://www.kariburt.com">Learn more about me at kariburt.com</a>
    </div>
</body>
</html>
